<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spedition Rampe Tool</title>

  <!-- XLSX Library (Excel Export) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body { font-family: Arial; background:#f4f4f4; padding:10px; }
    .box { background:white; padding:15px; max-width:900px; margin:auto; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1);} 
    h2 { text-align:center; }
    label { font-weight:bold; }
    input, select { width:100%; padding:12px; margin:6px 0; font-size:16px; }
    button { width:100%; padding:14px; margin-top:10px; background:black; color:white; border:none; border-radius:8px; font-size:16px; }
    table { width:100%; margin-top:20px; border-collapse:collapse; font-size:12px; }
    th, td { border:1px solid #ddd; padding:6px; text-align:center; }
    th { background:#eee; }
  </style>
</head>
<body>

<div class="box">
  <h2>🚛 Spedition Rampe Tool</h2>

  <label>Datum</label>
  <input type="date" id="datum">

  <label>Produzent</label>
  <select id="produzent">
    <option value="">Produzent wählen</option>
    <option>Bomadek</option>
    <option>Bodama</option>
    <option>Podolski</option>
    <option>Bimex</option>
    <option>Animex K4</option>
    <option>Dasyzna</option>
    <option>OSI</option>
    <option>Indrol</option>
    <option>Gobarto</option>
    <option>Wipasz</option>
    <option>Plukon</option>
  </select>

  <label>Paletten Nr</label>
  <input id="pallnr">

  <label>E2 IN</label>
  <input type="number" id="e2_in">

  <label>H1 IN</label>
  <input type="number" id="h1_in">

  <label>Einweg</label>
  <input type="number" id="einweg">

  <label>EPAL</label>
  <input type="number" id="epal">

  <label>E2 OUT</label>
  <input type="number" id="e2_out">

  <label>H1 OUT</label>
  <input type="number" id="h1_out">

  <button onclick="addEntry()">➕ Speichern</button>
  <button onclick="exportExcel()">📦 Excel Export</button>
  <button onclick="clearData()">🗑️ Reset</button>

  <table>
    <thead>
      <tr>
        <th>Datum</th>
        <th>Produzent</th>
        <th>Pall Nr</th>
        <th>E2 IN</th>
        <th>H1 IN</th>
        <th>Einweg</th>
        <th>EPAL</th>
        <th>E2 OUT</th>
        <th>H1 OUT</th>
      </tr>
    </thead>
    <tbody id="table"></tbody>
  </table>
</div>

<script>
let data = JSON.parse(localStorage.getItem("spedition_data") || "[]");
render();

function save(){
  localStorage.setItem("spedition_data", JSON.stringify(data));
}

function addEntry(){
  data.push({
    datum: document.getElementById('datum').value || "",
    produzent: document.getElementById('produzent').value || "",
    pallnr: document.getElementById('pallnr').value || "",
    e2_in: Number(document.getElementById('e2_in').value || 0),
    h1_in: Number(document.getElementById('h1_in').value || 0),
    einweg: Number(document.getElementById('einweg').value || 0),
    epal: Number(document.getElementById('epal').value || 0),
    e2_out: Number(document.getElementById('e2_out').value || 0),
    h1_out: Number(document.getElementById('h1_out').value || 0)
  });

  save();
  render();
}

function render(){
  let tbody = document.getElementById('table');
  tbody.innerHTML = '';

  data.forEach(r => {
    tbody.innerHTML += `
      <tr>
        <td>${r.datum}</td>
        <td>${r.produzent}</td>
        <td>${r.pallnr}</td>
        <td>${r.e2_in}</td>
        <td>${r.h1_in}</td>
        <td>${r.einweg}</td>
        <td>${r.epal}</td>
        <td>${r.e2_out}</td>
        <td>${r.h1_out}</td>
      </tr>
    `;
  });
}

function exportExcel(){
  if(data.length === 0){
    alert("Keine Daten vorhanden!");
    return;
  }

  // Summen pro Produzent
  let perProduzent = {};

  data.forEach(r => {
    if(!perProduzent[r.produzent]){
      perProduzent[r.produzent] = {e2_in:0,h1_in:0,einweg:0,epal:0,e2_out:0,h1_out:0};
    }

    perProduzent[r.produzent].e2_in += r.e2_in;
    perProduzent[r.produzent].h1_in += r.h1_in;
    perProduzent[r.produzent].einweg += r.einweg;
    perProduzent[r.produzent].epal += r.epal;
    perProduzent[r.produzent].e2_out += r.e2_out;
    perProduzent[r.produzent].h1_out += r.h1_out;
  });

  let exportData = [...data];

  exportData.push({datum:"",produzent:"",pallnr:"",e2_in:"",h1_in:"",einweg:"",epal:"",e2_out:"",h1_out:""});

  for(let p in perProduzent){
    exportData.push({
      datum:"",
      produzent:"SUMME " + p,
      pallnr:"",
      e2_in: perProduzent[p].e2_in,
      h1_in: perProduzent[p].h1_in,
      einweg: perProduzent[p].einweg,
      epal: perProduzent[p].epal,
      e2_out: perProduzent[p].e2_out,
      h1_out: perProduzent[p].h1_out
    });
  }

  let ws = XLSX.utils.json_to_sheet(exportData);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Tagesbericht");

  let today = document.getElementById('datum').value || 'report';
  XLSX.writeFile(wb, `Tagesbericht_${today}.xlsx`);
}

function clearData(){
  if(confirm("Alles löschen?")){
    data = [];
    save();
    render();
  }
}
</script>

</body>
</html>
